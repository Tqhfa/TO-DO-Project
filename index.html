<!DOCTYPE html>
<html>

<head>
    <title>Facebook Post System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <h2 class="text-left"><img src="" alt="">Facebook Profile</h2>

        <!-- Post Input -->
        <input type="text" id="post" class="form-control mt-4" placeholder="What's on your mind?">

        <button id="postBtn" class="btn btn-primary mt-2"> Post </button>

        <!-- Posts -->
        <div id="postBox" class="mt-4"></div>

    </div>


    <script>

        let post = document.querySelector("#post");
        let postBtn = document.querySelector("#postBtn");
        let postBox = document.querySelector("#postBox");


        // CREATE POST
        postBtn.onclick = function () {

            if (post.value == "") {

                console.log("Please write something!");

                return;
            }


            postBox.innerHTML += `

        <div class="card p-3 mb-3">

            <p class="postText"> ${post.value} </p>


            <button class="btn btn-warning editBtn"onclick="editPost(this)"> Edit</button>


            <button class="btn btn-danger deleteBtn mt-2"onclick="deletePost(this)"> Delete</button>

        </div>

    `;


            console.log("Post Created:", post.value);


            // Clear input
            post.value = "";

        };



        // EDIT POST
        function editPost(button) {

            let postBox = button.parentElement;

            let postText = postBox.querySelector(".postText");


            let newPost = prompt(
                "Edit your post:",
                postText.innerText
            );


            // OK + empty check
            if (newPost != null && newPost != "") {

                // Change post
                postText.innerText = newPost;


                // Hide Edit button
                button.style.display = "none";


                // Hide Delete button
                let deleteBtn =
                    postBox.querySelector(".deleteBtn");

                deleteBtn.style.display = "none";


                console.log("Post Edited:", newPost);

            }


            // Cancel
            else if (newPost == null) {

                console.log("Edit Cancelled");

            }


            // Empty text
            else {

                console.log("Post cannot be empty");

            }

        }



        // DELETE POST
        function deletePost(button) {

            let postBox = button.parentElement;

            let postText =
                postBox.querySelector(".postText");


            console.log(
                "Post Deleted:",
                postText.innerText
            );


            postBox.remove();

        }

    </script>

</body>

</html>
